let G={i:0,a:[]};
function renderGame(){
const d=D[L],box=document.getElementById('game'),n=document.getElementById('needle');
if(G.a.length){n.hidden=false;n.style.left=(50+G.a.reduce((x,y)=>x+d.s[y.s].o[y.o][1],0)/G.a.length*42)+'%'}else n.hidden=true;
if(G.i>=d.s.length){
const v=G.a.map(y=>d.s[y.s].o[y.o][1]),sum=v.reduce((x,y)=>x+y,0),k=v.every(x=>x===0)?'good':sum<0?'soft':sum>0?'hard':'mix';
box.innerHTML=`<div class="res"><h3>${d.res[k][0]}</h3><p>${d.res[k][1]}</p><div class="rulesh">${d.rulesh}</div><ol class="rules">${d.rules.map(r=>`<li>${r}</li>`).join('')}</ol><div class="acts"><a class="btn primary" href="https://calendly.com/happysphere/30min">${d.book30}</a><button class="btn ghost" id="again">${d.again}</button></div><p class="src">${d.src}</p></div>`;
document.getElementById('again').onclick=()=>{G={i:0,a:[]};renderGame()};return}
const c=d.s[G.i],ans=G.a.find(y=>y.s===G.i);
box.innerHTML=`<div class="step">${d.step} ${G.i+1} / ${d.s.length}</div><div class="who">${c.w}</div><div class="line">${c.l}</div><div class="opts">${c.o.map((o,j)=>`<button data-o="${j}" ${ans?'disabled':''} class="${ans&&ans.o===j?'on':''}">${o[0]}</button>`).join('')}</div>${ans?`<div class="fb"><b>${d.fbh[c.o[ans.o][1]]}</b>${c.o[ans.o][2]}</div><div class="acts"><button class="btn primary" id="nx">${G.i+1<d.s.length?d.next:d.see}</button></div>`:''}`;
box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{G.a.push({s:G.i,o:+b.dataset.o});renderGame();document.getElementById('nx').focus({preventScroll:true})});
const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{G.i++;renderGame()}}
let L='fr',Q='eu';

function render(){
const d=D[L];document.documentElement.lang=L;
document.querySelectorAll('[data-i]').forEach(e=>{const v=d[e.dataset.i];if(v!==undefined)e.innerHTML=v});
document.getElementById('pills').innerHTML=d.pills.map(x=>`<span>${x}</span>`).join('');
document.getElementById('topics').innerHTML=d.topics.map(x=>`<span>${x}</span>`).join('');

L=pick();render();
</script>
